appId: com.example.knucklegame
---
- launchApp:
    clearState: true
- tapOn: Fake link
- tapOn: Your name
- inputText: Host
- hideKeyboard
- tapOn: Host a game
- extendedWaitUntil:
    visible: FakePeer
    timeout: 15000
# Play 3 turns: tap the 3D die to roll (point: the SceneView exposes no text),
# then tap the middle column by its accessibility label.
- repeat:
    times: 3
    commands:
      - extendedWaitUntil:
          visible: Your turn
          timeout: 30000
      - tapOn: roll die
      - extendedWaitUntil:
          visible: Tap a column to place the die
          timeout: 15000
      - tapOn: own column 1
